{% extends "base.html" %}

{% block title %}Sign In — StockTrade Virtual Platform{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm border">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <div class="d-inline-flex p-3 rounded-circle bg-light text-primary mb-2">
            <i class="bi bi-shield-lock-fill" style="font-size: 2rem; color: var(--teal);"></i>
          </div>
          <h4 class="fw-bold mb-1" style="color: var(--navy);">Sign In to StockTrade</h4>
          <p class="text-muted small">Virtual Trading & Database Simulation Terminal</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          
          <div class="mb-3">
            <label for="identifier" class="form-label small fw-semibold">Email or Username</label>
            <input type="text" class="form-control" id="identifier" name="identifier" value="{{ identifier or '' }}" required autofocus placeholder="admin / investor_rahul">
          </div>

          <div class="mb-3">
            <label for="password" class="form-label small fw-semibold">Password</label>
            <input type="password" class="form-control" id="password" name="password" required placeholder="Enter password">
          </div>

          <div class="d-grid mt-4">
            <button type="submit" class="btn btn-primary">Sign In</button>
          </div>
        </form>

        <div class="mt-4 pt-3 border-top">
          <label class="form-label small text-muted fw-semibold d-block mb-2">Quick Demo Accounts:</label>
          <div class="d-flex flex-wrap gap-1">
            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="setDemo('admin', 'Admin@StockTrade2026')">Admin</button>
            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="setDemo('broker_arun', 'Broker@StockTrade2026')">Broker Arun</button>
            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="setDemo('investor_rahul', 'Investor@StockTrade2026')">Investor Rahul</button>
            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="setDemo('investor_sneha', 'Investor@StockTrade2026')">Investor Sneha</button>
          </div>
        </div>
      </div>
      <div class="card-footer bg-light text-center py-2 small text-muted">
        <i class="bi bi-info-circle me-1"></i> Simulated Money Only. No real funds or execution.
      </div>
    </div>
  </div>
</div>

<script>
function setDemo(u, p) {
  document.getElementById('identifier').value = u;
  document.getElementById('password').value = p;
}
</script>
{% endblock %}
